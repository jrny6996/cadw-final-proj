<!DOCTYPE html>

<!--Fernnada-->
<html lang="en">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPear Checkout</title>
    <style>
        :root {
            /*using colors used in landing page fron*/
            --iPear-primary-color: #008080; 
            --iPear-primary-hover: #006b6b;
            --background-color: #f5f5f7;
            --text-dark: #1d1d1f;
            --text-medium: #6e6e73;
            --border-light: #d2d2d7;
            --box-background: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--background-color);
            margin: 0;
            padding: 40px 0;
            color: var(--text-dark);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            font-size: 32px;
            font-weight: 700; 
            margin-bottom: 30px;
        }

        .checkout-layout {
            display: flex;
            gap: 30px;
        }

        .main-content {
            flex: 2;
        }

        .summary-sidebar {
            flex: 1;
        }

        .section-box {
            background-color: var(--box-background);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); 
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 20px;
        }
/* ---teh shipping and  styling  ---- */

        .shipping-form {
            font-size: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .input-group input,
        .input-group select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            font-size: 15px;
            background: #fafafa;
        }

        .input-row {
            display: flex;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .input-row {
                flex-direction: column;
            }
        }

        /* ---- cart summary where we can see all products chosen ---- */

        .item {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .item-image {
            width: 80px;
            height: 80px;
            margin-right: 20px;
            background-color:#e3f2f2; 
            border: 1px solid #cce0e0;
            border-radius:6px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size: 10px;
            color: var(--iPear-primary-color);
            text-align: center;
        }

        .item-name {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .item-price {
            font-weight: 600;
            color: var(--text-dark);
            text-align: right;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 17px;
        }

        .summary-row.total {
            font-size: 22px;
            font-weight: 700;
            padding-top: 15px;
            border-top: 1px solid var(--border-light);
            margin-top: 10px;
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--iPear-primary-color);
            color: white;
            padding: 14px 0; 
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }

        .checkout-btn:hover {
            background-color: var(--iPear-primary-hover);
        }

        /* Navigation bar */
        nav {
            position: fixed;top: 0;width: 100%; background: rgba(255, 255, 255, 0.8);backdrop-filter: blur(20px);border-bottom: 1px solid rgba(0, 0, 0, 0.1);z-index: 1000;
        }


        .nav-container {
            max-width: 1200px;margin:0 auto; padding:0 20px;display: flex; justify-content: space-between; align-items: center;height: 60px;
        }

        .logo {
            font-size: 30px;font-weight: 700;
        }

        .nav-links {
            display: flex;gap: 30px;list-style: none;
        }

        .nav-links a {
            text-decoration: none;color: #000000;font-size: 15px;transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .nav-icons {
            display: flex; gap: 9px;
        }

        .nav-icons button {
            border: none;background: none;cursor: pointer;padding: 9px;border-radius: 50%;transition: background 0.3s;
        }

        .nav-icons button:hover {
            background: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
<!-- Nav -->
    <nav id="navbar">
        <div class="nav-container">
            <div class="logo">iPear</div>
            <ul class="nav-links">
                <li><a href="#store">Store</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#iphone">iPear Phone</a></li>
                <li><a href="#ipad">iPear Pad</a></li>
                <li><a href="#watch">iPear Watch</a></li>
                <li><a href="#support">Support</a></li>
            </ul>
            <div class="nav-icons">
                <button>🔍</button>
                
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
        </div>
    </nav>


    <div class="container">
        <h1 class="header">IPear Order Review</h1>

        <div class="checkout-layout">

            <!-- Main Side -->
            <div class="main-content">

                <!-- contacnt section for shipping  -->
                <div class="section-box">
                    <div class="section-title">Shipping & Contact</div>

                    <form class="shipping-form">

                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" placeholder="you@example.com" required>
                        </div>

                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" placeholder="(123) 456-7890">
                        </div>

                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="Your full name" required>
                        </div>

                        <div class="input-group">
                            <label>Address</label>
                            <input type="text" placeholder="123 Main St" required>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label>City</label>
                                <input type="text" placeholder="City" required>
                            </div>

                            <div class="input-group">
                                <label>State</label>
                                <input type="text" placeholder="State" required>
                            </div>

                            <div class="input-group">
                                <label>ZIP</label>
                                <input type="text" placeholder="00000" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Country</label>
                            <select required>
                                <option value="" disabled selected>Select Country</option>
                                <option>United States</option>
                                <option>Canada</option>
                                <option>Mexico</option>
                            </select>
                        </div>

                    </form>
                </div>

                <!-- Bag  -->
                <div class="section-box">
                    <div class="section-title">Your IPear Bag</div>
                    <div id="cart-content"></div>
                </div>

            </div>

            <!-- Summary Sidebar -->
            <div class="summary-sidebar">
                <div class="section-box">
                    <div class="section-title">Summary</div>

                    <div class="summary-details">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal-amount">$0.00</span>
                        </div>

                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span id="shipping-amount">$0.00</span>
                        </div>

                        <div class="summary-row">
                            <span>Tax (Local):</span>
                            <span id="tax-amount">$0.00</span>
                        </div>

                        <div class="summary-row total">
                            <span>Total Due:</span>
                            <span id="total-amount">$0.00</span>
                        </div>
                    </div>

                    <button class="checkout-btn" id="checkout-button" disabled>
                        Complete IPear Order
                    </button>

                    <p id="empty-cart-text" 
                       style="text-align:center; margin-top:15px; font-size:14px; color:#c1c1c1;">
                    </p>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
